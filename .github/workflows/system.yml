name: Build one system

on:
  workflow_call:
    inputs:
      name: { type: string, required: true }
      runner: { type: string, required: true }
      os: { type: string, required: true }
      arch: { type: string, required: true }
      heap: { type: number, required: true }

permissions: {}

env:
  APP_NAME: KaivonCode
  DISPLAY_NAME: Kaivon Code
  BINARY_NAME: kaivon-code
  ASSETS_REPOSITORY: ${{ github.repository }}
  GH_REPO_PATH: ${{ github.repository }}
  ORG_NAME: Kaivon
  VSCODE_QUALITY: stable
  # Compile and package in one job on each system.
  CI_BUILD: 'no'
  SHOULD_BUILD: 'yes'
  # Not needed yet: remote servers and the tunnel CLI.
  SHOULD_BUILD_REH: 'no'
  SHOULD_BUILD_REH_WEB: 'no'
  SHOULD_BUILD_CLI: 'no'
  SHOULD_BUILD_DEB: 'no'
  SHOULD_BUILD_RPM: 'no'
  SHOULD_BUILD_EXE_SYS: 'no'
  SHOULD_BUILD_MSI: 'no'
  SHOULD_BUILD_MSI_NOUP: 'no'

jobs:
  build:
    name: Build
    runs-on: ${{ inputs.runner }}
    timeout-minutes: 300
    # Read only: this job runs thousands of packages' install scripts.
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    env:
      OS_NAME: ${{ inputs.os }}
      VSCODE_ARCH: ${{ inputs.arch }}
      MAX_OLD_SPACE_SIZE: ${{ inputs.heap }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .nvmrc

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11'

      - name: Version
        # VS Code's version, then this build's number: 1.143.1 and build 12 is 1.143.11012.
        run: echo "RELEASE_VERSION=$( jq -r .tag upstream/stable.json )$(( 1000 + GITHUB_RUN_NUMBER ))" >> "${GITHUB_ENV}"

      - name: Linux packages
        if: inputs.os == 'linux'
        run: sudo apt-get update -y && sudo apt-get install -y build-essential g++ libx11-dev libxkbfile-dev libsecret-1-dev libkrb5-dev

      - name: Chip
        working-directory: chip
        run: |
          set -o pipefail
          npm ci 2>&1 | tee -a ../build.log
          npm test 2>&1 | tee -a ../build.log
          npm run build 2>&1 | tee -a ../build.log

      - name: Get VS Code's source
        run: |
          set -o pipefail
          . get_repo.sh 2>&1 | tee -a build.log

      - name: Build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -o pipefail
          ./build.sh 2>&1 | tee -a build.log

      - name: Package
        run: |
          set -o pipefail
          ./prepare_assets.sh 2>&1 | tee -a build.log

      # Job logs need a sign-in to read; annotations are public, so failures can be read from anywhere.
      - name: Say what failed
        if: failure()
        run: |
          clean() { sed -e 's/\x1b\[[0-9;]*[A-Za-z]//g' | cut -c1-200 | sed -e 's/%/%25/g' | awk 'BEGIN { ORS = "%0A" } 1'; }
          echo "::error title=${{ inputs.name }}: errors::$( grep -nE 'error( |:)|Error:|ERR!|fatal:|FAILED|Cannot find' build.log | tail -n 30 | clean )"
          echo "::error title=${{ inputs.name }}: last lines::$( tail -n 40 build.log | clean )"

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: kaivon-code-${{ inputs.os }}-${{ inputs.arch }}
          path: assets/
          retention-days: 14
          if-no-files-found: error

  publish:
    name: Publish
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: kaivon-code-${{ inputs.os }}-${{ inputs.arch }}
          path: assets

      - name: Fixed names, so download links never change
        working-directory: assets
        run: |
          case "${{ inputs.os }}-${{ inputs.arch }}" in
            osx-arm64) mv *.dmg KaivonCode-mac-apple-silicon.dmg; mv *.zip KaivonCode-mac-apple-silicon.zip ;;
            osx-x64) mv *.dmg KaivonCode-mac-intel.dmg; mv *.zip KaivonCode-mac-intel.zip ;;
            windows-x64) mv *Setup*.exe KaivonCode-windows-setup.exe; mv *.zip KaivonCode-windows.zip ;;
            linux-x64) mv *.tar.gz KaivonCode-linux.tar.gz ;;
          esac
          for f in KaivonCode-*; do sha256sum "$f" > "$f.sha256"; done
          ls -la

      - name: Add to the release
        run: |
          case "${GITHUB_REF_NAME}" in *beta*) KIND=--prerelease ;; *) KIND=--latest ;; esac
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>&1 || gh release create "${GITHUB_REF_NAME}" --title "Kaivon Code ${GITHUB_REF_NAME}" --generate-notes "${KIND}" || true
          gh release upload "${GITHUB_REF_NAME}" assets/* --clobber
