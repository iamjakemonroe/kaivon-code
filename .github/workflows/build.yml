name: Build

# Pushing a tag builds Kaivon Code for every system on GitHub's machines. Each system publishes to
# the tag's release as soon as it's ready, so one slow queue never holds back the others. A tag with
# "beta" in it is a pre-release; any other v* tag becomes the latest, which code.kaivon.app downloads.

on:
  push:
    tags: ['v*']

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  system:
    name: ${{ matrix.name }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: Mac (Apple Silicon), runner: macos-14, os: osx, arch: arm64, heap: 12288 }
          - { name: Mac (Intel), runner: macos-15-intel, os: osx, arch: x64, heap: 12288 }
          - { name: Windows, runner: windows-2022, os: windows, arch: x64, heap: 8192 }
          - { name: Linux, runner: ubuntu-22.04, os: linux, arch: x64, heap: 8192 }
    uses: ./.github/workflows/system.yml
    with:
      name: ${{ matrix.name }}
      runner: ${{ matrix.runner }}
      os: ${{ matrix.os }}
      arch: ${{ matrix.arch }}
      heap: ${{ matrix.heap }}
